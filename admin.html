<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학습지 관리자 시스템 (테스트 모드)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #f1f5f9;
      color: #1e293b;
      padding: 30px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      margin-bottom: 24px;
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-success {
      background-color: #16a34a;
      color: white;
    }

    .btn-success:hover {
      background-color: #15803d;
    }

    .btn-outline {
      background-color: transparent;
      border: 1px solid #cbd5e1;
      color: #475569;
    }

    .btn-outline:hover {
      background-color: #f8fafc;
    }

    .table-container {
      overflow-x: auto;
      margin-top: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      text-align: left;
    }

    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid #e2e8f0;
      white-space: nowrap;
    }

    th {
      background-color: #f8fafc;
      color: #475569;
      font-weight: 600;
    }

    tr:hover {
      background-color: #f8fafc;
    }

    .badge-count {
      background-color: #e0e7ff;
      color: #1d4ed8;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="dashboard-header">
      <div>
        <h2>확률 학습지 제출 현황 <span id="recordCount" class="badge-count">0명</span></h2>
        <span style="font-size: 0.85rem; color: #64748b;">테스트 모드: 별도 로그인 없이 즉시 조회됩니다.</span>
      </div>
      <div class="btn-group">
        <button id="btnRefresh" class="btn btn-outline">새로고침</button>
        <button id="btnDownloadCsv" class="btn btn-success">Excel/CSV 다운로드</button>
      </div>
    </div>

    <div class="card">
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>학년</th>
              <th>반</th>
              <th>번호</th>
              <th>이름</th>
              <th>1번(객)</th>
              <th>2번(객)</th>
              <th>3번(객)</th>
              <th>4번(주)</th>
              <th>5번(주)</th>
